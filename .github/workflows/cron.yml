name: dispatch-publish
# 공개 저장소에서만 schedule이 돌므로, 여기서 비공개 reels-uploader의 publish.yml을 깨운다.
# GitHub cron은 몇 시간씩 늦거나 빠지므로 15분마다 두드리고, 슬롯 판단(KST 08·09·10·20·21·22,
# 시간대당 1편)은 publish.yml의 slot gate가 한다.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: gh workflow run publish.yml -R jonghoney512/reels-uploader --ref main
